appId: app.pagekeep.desktop
productName: 页游保活
directories:
  output: release
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.games
  identity: null
  notarize: false
  artifactName: "Pagekeep-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
linux:
  target:
    - dir
