<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行测试 — Still</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:Canvas;color:CanvasText}header{padding:24px 40px;border-bottom:1px solid GrayText;display:flex;gap:24px;align-items:center}header strong{font-size:18px}header span{color:GrayText;font-size:13px}main{max-width:960px;margin:28px auto;padding:0 20px}canvas{display:block;width:960px;max-width:100%;height:540px;border-radius:4px;background:#172526}footer{display:flex;align-items:center;gap:12px;padding:20px 0;font-size:13px}button,a{font:inherit}button{padding:6px 12px}output{font-variant-numeric:tabular-nums;color:GrayText}p{color:GrayText;font-size:13px;line-height:1.6}
</style>
<header><strong>运行测试</strong><span>本地测试页面 · 不连接游戏账户</span></header>
<main><canvas id="game-canvas" width="960" height="540" aria-label="动画测试画布"></canvas>
<footer><button id="count">点击计数</button><output id="clicks">0 次</output><button id="popup">打开测试标签</button><a href="data:text/plain;charset=utf-8,Still%20download%20test" download="still-test.txt">测试下载</a></footer>
<output id="stats">正在启动</output><p>此页面通过原生 requestAnimationFrame 绘制。切换到其他标签、遮挡窗口或最小化后，回来看累计帧数和定时器计数。页面计数不能代替实际游戏进度的验证。</p>
<p>查找测试标记：Still Browser Test Marker</p></main>
<script>
window.fixture={identity:Math.random().toString(36),frames:0,timers:0,clicks:0};
const canvas=document.getElementById('game-canvas'),ctx=canvas.getContext('2d');
function draw(time){fixture.frames++;ctx.fillStyle='#172526';ctx.fillRect(0,0,960,540);ctx.strokeStyle='#304446';ctx.lineWidth=1;for(let x=0;x<960;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,540);ctx.stroke();}for(let y=0;y<540;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke();}const x=480+Math.sin(time/1100)*220,y=270+Math.cos(time/1600)*120;ctx.fillStyle='#e0d8c4';ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c3d1cc';ctx.font='16px system-ui';ctx.fillText('Still · Native canvas',30,38);ctx.font='13px system-ui';ctx.fillText('Frame '+fixture.frames,30,510);requestAnimationFrame(draw);}
requestAnimationFrame(draw);
setInterval(()=>{fixture.timers++;document.getElementById('stats').textContent='动画帧 '+fixture.frames+' · 100 ms 定时器 '+fixture.timers;},100);
document.getElementById('count').onclick=()=>{fixture.clicks++;document.getElementById('clicks').textContent=fixture.clicks+' 次';};
document.getElementById('popup').onclick=()=>window.open('about:blank','_blank');
</script></html>
