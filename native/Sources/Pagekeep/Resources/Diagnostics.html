<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台运行测试</title>
<style>:root{color-scheme:light dark;font-family:system-ui}body{margin:24px;padding:0 12px}h1{font-size:23px;font-weight:550}p{line-height:1.6;color:GrayText;max-width:980px}main{display:flex;align-items:flex-start;gap:20px}iframe{display:block;width:680px;max-width:95%;height:360px;border:1px solid GrayText;border-radius:2px;flex:none}.small{width:240px;height:180px;max-width:none}output{font-variant-numeric:tabular-nums}@media(max-width:950px){main{flex-wrap:wrap}.small{height:150px}}</style>
<h1>后台运行测试</h1><p>依次测试切换标签、遮挡、最小化和其他桌面，在“运行设置与检测”查看调度结果。这是测试页面，不是实际游戏兼容性证明。</p>
<p>主页面计时器：<output id="ticks">0</output> · 页面可见性：<output id="state"></output></p>
<main><iframe id="game-frame" title="游戏测试区域" srcdoc="<!doctype html><meta charset=utf-8><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18232c;color:#eee;font:16px system-ui}canvas{display:block;width:100%;height:100%}</style><canvas id=game width=680 height=360></canvas><script>window.fixtureToken=String(Math.random());window.fixtureFrameCount=0;const c=document.getElementById('game'),x=c.getContext('2d');function frame(t){fixtureFrameCount++;x.fillStyle='#18232c';x.fillRect(0,0,680,360);x.fillStyle='#d6dbe0';x.font='20px system-ui';x.fillText('游戏区域测试',28,40);x.font='16px system-ui';x.fillText('Frames: '+fixtureFrameCount,28,72);x.beginPath();x.arc(340+Math.sin(t/800)*210,215,24,0,7);x.fill();requestAnimationFrame(frame)}requestAnimationFrame(frame)</script>"></iframe><section id="extra"></section></main>
<p>专注和切换运行模式都应保留原来的 iframe 与计数器，不应从零重新加载。</p>
<script>window.fixtureToken=String(Math.random());window.fixtureReady=true;let ticks=0;setInterval(()=>{document.getElementById('ticks').textContent=++ticks;document.getElementById('state').textContent=document.visibilityState},100);if(new URLSearchParams(location.search).has('smoke')){const f=document.createElement('iframe');f.className='small';f.title='Cross-origin fixture';f.src='http://127.0.0.1:18766/Frame.html';document.getElementById('extra').appendChild(f)}</script></html>
