<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台运行测试</title>
<style>:root{color-scheme:light dark;font-family:system-ui}body{max-width:1040px;margin:32px auto;padding:0 24px}h1{font-size:23px;font-weight:550}p{line-height:1.6;color:GrayText}iframe{width:720px;max-width:95%;height:405px;border:1px solid GrayText;border-radius:2px}section{margin-top:24px}.small{width:300px;height:170px;margin-right:16px}output{font-variant-numeric:tabular-nums}</style>
<h1>后台运行测试</h1><p>这是测试页面，不是实际游戏兼容性证明。依次测试切换标签、遮挡、最小化和其他桌面；在“运行设置与检测”查看主页面与子框架的探针。</p>
<p>主页面计时器：<output id="ticks">0</output> · 页面看到的可见性：<output id="state"></output></p>
<iframe id="game-frame" title="游戏测试区域" srcdoc="<!doctype html><meta charset=utf-8><style>body{margin:0;background:#18232c;color:#eee;font:16px system-ui}canvas{width:100%;height:100%}</style><canvas id=game width=720 height=405></canvas><script>window.fixtureToken=String(Math.random());const c=document.getElementById('game'),x=c.getContext('2d');let n=0;function frame(t){n++;x.fillStyle='#18232c';x.fillRect(0,0,720,405);x.fillStyle='#d6dbe0';x.font='20px system-ui';x.fillText('游戏区域测试',28,40);x.font='16px system-ui';x.fillText('Frames: '+n,28,72);x.beginPath();x.arc(360+Math.sin(t/800)*220,230,24,0,7);x.fill();requestAnimationFrame(frame)}requestAnimationFrame(frame)</script>"></iframe>
<section id="extra"></section><p>专注必须保留原来的 iframe 与计数器，不能从零重新加载。</p>
<script>window.fixtureToken=String(Math.random());window.fixtureReady=true;let ticks=0;setInterval(()=>{document.getElementById('ticks').textContent=++ticks;document.getElementById('state').textContent=document.visibilityState},100);if(new URLSearchParams(location.search).has('smoke')){const f=document.createElement('iframe');f.className='small';f.title='Cross-origin fixture';f.src='http://127.0.0.1:18766/Frame.html';document.getElementById('extra').appendChild(f)}</script></html>
